[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctify-hivemind"
version = "0.1.0"
description = "A multi-agent orchestration framework for autonomous operations on live systems (WordPress as first environment)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanctify" }]
keywords = ["multi-agent", "orchestration", "autonomous-agents", "actor-critic", "wordpress", "ai-agents"]

# Core is dependency-light on purpose. Environment adapters pull their own extras.
dependencies = []

[project.optional-dependencies]
wordpress = ["requests>=2.28"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hivemind = "hivemind.cli:main"

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.ruff]
line-length = 100
